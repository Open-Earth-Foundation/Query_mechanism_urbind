orchestrator:
  model: "openai/gpt-5.4-mini"
  temperature: 0.0
  reasoning_effort: "medium"
  context_bundle_name: "context_bundle.json"
  context_window_tokens: 400000
  input_token_reserve: 20000
markdown_researcher:
  model: "openai/gpt-5.4-mini"
  temperature: 0.0
  reasoning_effort: "low"
  context_window_tokens: 200000
  input_token_reserve: 10000
  max_turns: 10
  max_chunk_tokens: 40000
  chunk_overlap_tokens: 2000
  # try this and how much it drops the time
  # every 16 chunks is adding ~13k tokens
  batch_max_chunks: 32
  batch_max_input_tokens: null
  batch_overhead_tokens: 600
  max_workers: 8
  request_backoff_base_seconds: 0.5
  request_backoff_max_seconds: 2.0
initiative_extractor:
  model: "openai/gpt-5.4-mini"
  temperature: 0.0
  reasoning_effort: "low"
  context_window_tokens: 200000
  input_token_reserve: 10000
  max_turns: 5
  max_segment_tokens: 20000
  segment_overlap_lines: 4
  max_workers: 4
  prior_initiatives_max_tokens: 10000
  semantic_dedupe_enabled: true
  semantic_dedupe_max_records_per_batch: 120
  semantic_dedupe_max_input_tokens: 80000
  semantic_dedupe_confidence_threshold: 0.78
  action_heavy_initiative_threshold: 3
  action_heavy_max_followup_calls: 6
tef_mapper:
  model: "openai/gpt-5.4-mini"
  temperature: 0.0
  reasoning_effort: "low"
  max_turns: 5
  max_workers: 4
  review_confidence_threshold: 0.80
  close_alternative_delta: 0.10
  min_transition_confidence: 0.60
  numeric_unit_classifier_enabled: true
writer:
  model: "openai/gpt-5.4-mini"
  temperature: 0.0
  reasoning_effort: "high"
  context_window_tokens: 400000
  input_token_reserve: 20000
  max_turns: 5
  max_coverage_attempts: 2
chat:
  model: "openai/gpt-5.4-mini"
  temperature: 0.0
  reasoning_effort: "medium"
  context_window_tokens: 400000
  input_token_reserve: 20000
  max_history_messages: 12
  max_context_total_tokens: 220000
  min_prompt_token_cap: 20000
  provider_timeout_seconds: 60.0
  prompt_token_buffer: 2000
  multi_pass_threshold_tokens: 200000
  multi_pass_chunk_tokens: 150000
  followup_search_enabled: true
  max_auto_followup_bundles: 3
  followup_router_max_history_messages: 6
  followup_router_max_excerpts_per_source: 50
assumptions_reviewer:
  model: "openai/gpt-5.4-mini"
  temperature: 0.0
  reasoning_effort: "high"
enrichment:
  model: "openai/gpt-5.4-mini"
  temperature: 0.0
  reasoning_effort: "medium"
  enabled: false
  web_research_enabled: false
  # Two-phase gap analyst (Phase 0 decompose → Phase 1 local fan-out → Phase 2 detect)
  # so structured lookups + benchmark excerpts inform per-city gap detection.
  use_split_gap_flow: true
  # Search worker checks the curated tier-1 web allowlist (site:domain) before
  # falling through to open Serper.
  tier1_first_search: true
  tier1_confidence_threshold: 0.6
  max_workers: 6
  max_queries_per_batch: 25
  max_total_queries_per_run: 100
  max_retries_per_worker: 2
  max_deep_dives_per_run: 3
  max_pages_per_deep_dive: 10
  freshness_threshold_days: 730
  max_fields_per_query: 20
benchmark_fact_judge:
  model: "openai/gpt-5.4-mini"
  temperature: 0.0
  reasoning_effort: "high"
vector_store:
  # Disabled until the markdown_chunks collection is populated. With this off,
  # the orchestrator reads markdown directly from disk via load_markdown_documents
  # (which now recursively picks up documents/additional/<city>_<slug>/<city>.md
  # after the rglob fix in backend/utils/markdown_files.py).
  enabled: false
  chroma_persist_path: ".chroma"
  chroma_collection_name: "markdown_chunks"
  embedding_model: "text-embedding-3-large"
  embedding_max_input_tokens: 8000
  embedding_batch_size: 100
  embedding_max_retries: 3
  embedding_retry_base_seconds: 0.8
  embedding_retry_max_seconds: 8.0
  embedding_chunk_tokens: 800
  embedding_chunk_overlap_tokens: 80
  table_row_group_max_rows: 25
  retrieval_max_distance: 1.0
  retrieval_fallback_min_chunks_per_city_query: 20
  retrieval_max_chunks_per_city_query: 60
  retrieval_max_chunks_per_city: 300
  context_window_chunks: 0
  table_context_window_chunks: 1
  auto_update_on_run: false
  index_manifest_path: ".chroma/index_manifest.json"
retry:
  max_attempts: 3
  backoff_base_seconds: 1.0
  backoff_max_seconds: 30.0
openrouter_base_url: "https://openrouter.ai/api/v1"
