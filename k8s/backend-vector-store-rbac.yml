apiVersion: v1
kind: ServiceAccount
metadata:
  name: urbind-query-mechanism-backend
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: urbind-query-mechanism-vector-store-jobs
  namespace: default
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: urbind-query-mechanism-vector-store-jobs
  namespace: default
subjects:
  - kind: ServiceAccount
    name: urbind-query-mechanism-backend
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: urbind-query-mechanism-vector-store-jobs
