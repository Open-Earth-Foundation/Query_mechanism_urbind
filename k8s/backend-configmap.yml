apiVersion: v1
kind: ConfigMap
metadata:
  name: urbind-query-mechanism-backend-config
  namespace: default
data:
  PORT: "8000"
  RUNS_DIR: "/data/output"
  MARKDOWN_DIR: "/app/documents"
  CHROMA_PERSIST_PATH: "/data/chroma"
  CHROMA_COLLECTION_NAME: "markdown_chunks"
  VECTOR_STORE_ENABLED: "true"
  VECTOR_STORE_AUTO_UPDATE_ON_RUN: "true"
  VECTOR_STORE_UPDATE_MODE: "kubernetes_job"
  VECTOR_STORE_UPDATE_JOB_IMAGE: "ghcr.io/open-earth-foundation/query_mechanism_urbind-backend:dev"
  VECTOR_STORE_UPDATE_JOB_PVC: "urbind-query-mechanism-backend-output"
  VECTOR_STORE_UPDATE_JOB_CONFIGMAP: "urbind-query-mechanism-backend-config"
  VECTOR_STORE_UPDATE_JOB_SECRET: "urbind-query-mechanism-backend-secrets"
  VECTOR_STORE_UPDATE_JOB_MEMORY_REQUEST: "16Gi"
  VECTOR_STORE_UPDATE_JOB_MEMORY_LIMIT: "20Gi"
  VECTOR_STORE_UPDATE_JOB_TIMEOUT_SECONDS: "7200"
  LLM_CONFIG_PATH: "/app/llm_config.yaml"
  CITY_GROUPS_PATH: "/app/backend/api/assets/city_groups.json"
  OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
  CHAT_PROMPT_TOKEN_CAP: "250000"
  CHAT_PROVIDER_TIMEOUT_SECONDS: "50"
  LOG_LEVEL: "INFO"
  API_CORS_ORIGINS: "https://urbind-query-mechanism.openearth.dev"
